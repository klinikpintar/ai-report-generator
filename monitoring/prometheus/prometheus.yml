global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: 'nextjs-app'
    scrape_interval: 3s
    scrape_timeout: 2s
    metrics_path: /api/metrics
    scheme: http

    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          service: nextjs
          env: dev

    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*):\d+'
        target_label: instance
        replacement: '${1}'
        action: replace

    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'node_.*'
        action: drop  # Optional: drop irrelevant node metrics
