# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
enable_free_tier: true
auto_resolve_threads: true

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: true
  auto_title_placeholder: "@coderabbitai"
  review_status: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  poem: true
  tools:
    markdownlint:
      enabled: true
    eslint:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true
    checkov:
      enabled: true
    actionlint:
      enabled: true
  path_filters:
    - "!**/.xml"
    - "!**/__generated__/**"
    - "!**/generated/**"
    - "!**/*.json"
    - "!**/*.svg"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.gif"
    - "!**/*.lock"
  path_instructions:
    - path: "**/*.{ts,tsx,js,jsx}"
      instructions:
        "Review kode Next.js, React, dan TypeScript untuk memastikan best practices dalam hooks, server components,
        API Routes, serta optimasi performance menggunakan lazy loading dan caching. Berikan saran jika ada inefisiensi."
    - path: "**/next.config.js"
      instructions:
        "Periksa konfigurasi Next.js untuk kesesuaian dengan best practices, termasuk penggunaan i18n, optimasi gambar,
        dan setup API Routes."
    - path: "**/middleware.ts"
      instructions: "Periksa middleware Next.js untuk keamanan dan optimasi performa."
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "DRAFT"
    drafts: false
    base_branches:
      - "feature/.*"
      - "development"
  finishing_touches:
    docstrings:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  linear:
    usage: "auto"
    team_keys: []
  pull_requests:
    scope: "auto"

code_generation:
  docstrings:
    language: "en-US"
