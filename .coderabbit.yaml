# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json

language: "en"
early_access: false
reviews:
  request_changes_workflow: false
  high_level_summary: true
  poem: true
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - "!**/.xml"
    - "!**/__generated__/**"
    - "!**/generated/**"
    - "!**/*.json"
    - "!**/*.svg"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.gif"
    - "!**/*.lock"
  path_instructions:
    - path: "**/*.{ts,tsx,js,jsx}"
      instructions:
        "Review the Typescript and React code for conformity with best practices in React, Recoil,
        Graphql, and Typescript. Highlight any deviations."
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "feature/.*"
      - "development"
chat:
  auto_reply: true